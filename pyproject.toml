[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataverse-mcp-server"
version = "0.1.0"
description = "MCP server that gives AI agents safe, scoped access to Microsoft Dataverse / Dynamics 365."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mateus Miranda" }]
requires-python = ">=3.11"
keywords = ["mcp", "dataverse", "dynamics-365", "power-platform", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=2.3,<3",
    "msal>=1.28",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
dataverse-mcp = "dataverse_mcp.server:main"

[project.urls]
Repository = "https://github.com/mateusmirandaia/dataverse-mcp-server"

[tool.hatch.build.targets.wheel]
packages = ["src/dataverse_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
